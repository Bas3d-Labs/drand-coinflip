[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Pinned to match Bas3d-Labs/drand-quicknet-evm (`pragma solidity 0.8.36`).
solc_version = "0.8.36"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
remappings = [
    "forge-std/=lib/forge-std/src/",
    "drand-quicknet-evm/=lib/drand-quicknet-evm/contracts/src/",
]

[rpc_endpoints]
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
